<!DOCTYPE html>
<html>
<head>
    <title>Test Registration</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <h2>Test Registration</h2>
    
    <form id="registerForm">
        <div>
            <label>Email:</label>
            <input type="email" id="email" required>
        </div>
        <div style="margin-top: 10px;">
            <label>Password:</label>
            <input type="password" id="password" required>
        </div>
        <div style="margin-top: 10px;">
            <label>Full Name:</label>
            <input type="text" id="fullName" required>
        </div>
        <button type="submit" style="margin-top: 20px;">Register</button>
    </form>

    <div id="result" style="margin-top: 20px; padding: 10px; border: 1px solid #ccc;"></div>

    <script>
        // CORRECT Supabase credentials
        const SUPABASE_URL = 'https://iitvetxbqdutkxiyowbp.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_lmp0WexjNauoHELEFo9H8g_RFbOKuRU';
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const fullName = document.getElementById('fullName').value;
            
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = 'Attempting registration...';
            
            try {
                const { data, error } = await supabase.auth.signUp({
                    email: email,
                    password: password,
                    options: {
                        data: {
                            full_name: fullName
                        }
                    }
                });
                
                if (error) {
                    resultDiv.innerHTML = `❌ Error: ${error.message}`;
                    console.error('Registration error:', error);
                } else {
                    resultDiv.innerHTML = `✅ Success! User created.<br>`;
                    resultDiv.innerHTML += `User ID: ${data.user.id}<br>`;
                    resultDiv.innerHTML += `Email: ${data.user.email}<br>`;
                    resultDiv.innerHTML += `Check your Supabase dashboard → Authentication → Users to see the new user.`;
                }
            } catch (err) {
                resultDiv.innerHTML = `❌ Network error: ${err.message}`;
                console.error('Network error:', err);
            }
        });
    </script>
</body>
</html>
